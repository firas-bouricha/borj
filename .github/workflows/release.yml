name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o borj.exe .

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/borj | Out-Null
          Copy-Item borj.exe, borj-admin.cmd, README.md, LICENSE dist/borj/
          Compress-Archive -Path dist/borj/* -DestinationPath borj-windows-amd64.zip
          (Get-FileHash borj-windows-amd64.zip -Algorithm SHA256).Hash.ToLower() + "  borj-windows-amd64.zip" | Out-File -Encoding ascii checksums.txt

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" borj-windows-amd64.zip checksums.txt --title "BORJ ${{ github.ref_name }}" --generate-notes
